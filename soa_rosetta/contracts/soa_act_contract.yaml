robot_type: soa

fps: 30
max_duration_s: 10.0

observations:
  # Wrist USB cam -> model's observation.images.front
  # Training resolution: 1080x1920
  # VERIFY topic with: ros2 topic list | grep compressed
  - key: observation.images.front
    topic: /follower/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    image:
      resize: [1080, 1920]
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 10}

  # Overhead RealSense -> model's observation.images.side
  # Training resolution: 480x640
  # VERIFY topic with: ros2 topic list | grep compressed
  - key: observation.images.side
    topic: /static_camera/overhead_cam/color/image_raw/compressed
    type: sensor_msgs/msg/CompressedImage
    image:
      resize: [480, 640]
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 10}

  # Joint states: 6 joints from follower arm
  # Order MUST match training data index order
  # Custom decoder: maps ROS radians through raw servo ticks and applies
  # lerobot's per-joint range normalization (RANGE_M100_100 for arm,
  # RANGE_0_100 for gripper) using ranges from soa_params.yaml's
  # calibration JSON. Output matches `lerobot.SO101Follower.get_observation`.
  - key: observation.state
    topic: /follower/joint_states
    type: sensor_msgs/msg/JointState
    selector:
      names:
        - position.shoulder_pan
        - position.shoulder_lift
        - position.elbow_flex
        - position.wrist_flex
        - position.wrist_roll
        - position.gripper
    align: {strategy: hold, stamp: header}
    qos: {reliability: best_effort, history: keep_last, depth: 50}
    decoder: soa_rosetta.lerobot_norm_converters:decode_joint_state_norm

actions:
  # Arm ForwardCommandController: 5 arm joints -> Float64MultiArray
  # Custom encoder: interprets actions as lerobot RANGE_M100_100 percent
  # and writes the equivalent radians for the forward_command_controller.
  - key: action
    publish:
      topic: /follower/arm_fwd_controller/commands
      type: std_msgs/msg/Float64MultiArray
      qos: {reliability: reliable, history: keep_last, depth: 10}
    selector:
      names:
        - position.shoulder_pan
        - position.shoulder_lift
        - position.elbow_flex
        - position.wrist_flex
        - position.wrist_roll
    encoder: soa_rosetta.lerobot_norm_converters:encode_arm_fwd_norm
    safety_behavior: hold

  # Gripper ForwardCommandController: 1 gripper joint -> Float64MultiArray
  # Custom encoder: gripper uses RANGE_0_100 (not RANGE_M100_100).
  - key: action
    publish:
      topic: /follower/gripper_fwd_controller/commands
      type: std_msgs/msg/Float64MultiArray
      qos: {reliability: reliable, history: keep_last, depth: 10}
    selector:
      names:
        - position.gripper
    encoder: soa_rosetta.lerobot_norm_converters:encode_gripper_fwd_norm
    safety_behavior: hold

recording:
  storage: mcap
