# Camera configuration for bimanual SOA scenarios.
# Cameras are always on the follower arms only — never on leaders.
#
# Fields:
#   name:         unique camera identifier (also used as ROS node name)
#   camera_type:  'usb_camera' or 'realsense2_camera'
#   param_path:   filename within soa_bringup/config/ for camera parameters
#   attached_to:  ROS node namespace for the camera node

cameras:
  - name: wrist_cam_left
    camera_type: usb_camera
    param_path: soa_usb_cam.yaml
    attached_to: left_follower

  - name: wrist_cam_right
    camera_type: usb_camera
    param_path: soa_usb_cam.yaml
    attached_to: right_follower

  # Uncomment to add a shared static overhead RealSense camera:
  # - name: overhead_cam
  #   camera_type: realsense2_camera
  #   param_path: soa_realsense2.yaml
  #   attached_to: static_camera
